<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EA0FF"/>
      <stop offset="0.55" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#5E3FE0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161C"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9F0A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A0A40" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824pt squircle on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- Notch panel growing from the top edge -->
    <g filter="url(#panelShadow)">
      <path d="M252 100 H772 V570 Q772 660 682 660 H342 Q252 660 252 570 Z" fill="url(#panel)"/>
    </g>
    <!-- Camera -->
    <circle cx="512" cy="168" r="18" fill="#1F2633"/>
    <circle cx="512" cy="168" r="8" fill="#0E3A5C"/>
    <circle cx="508" cy="164" r="3" fill="#6FB6FF" opacity="0.8"/>

    <!-- Script lines -->
    <rect x="322" y="262" width="380" height="44" rx="22" fill="url(#cue)"/>
    <rect x="342" y="352" width="340" height="38" rx="19" fill="#FFFFFF" opacity="0.92"/>
    <rect x="372" y="434" width="280" height="38" rx="19" fill="#FFFFFF" opacity="0.6"/>
    <rect x="402" y="516" width="220" height="38" rx="19" fill="#FFFFFF" opacity="0.32"/>
  </g>
  <!-- Hairline edge highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
</svg>
